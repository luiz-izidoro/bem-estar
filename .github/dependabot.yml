version: 2
# Routine version updates are disabled to avoid notification noise.
# Security updates remain enabled in repository settings and have their own
# fixed limit (10 open PRs), independent of this option.
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
